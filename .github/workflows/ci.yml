name: CI

# Runs on every pull request, and on main after a merge. Feature branches are
# covered through their pull request, so a same-repo branch does not build twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The flake's only output is a darwinConfiguration for Apple silicon
  # (nixpkgs.hostPlatform = "aarch64-darwin"), so this has to be an Apple
  # silicon macOS runner. Evaluating on Linux could not resolve the nix-darwin
  # modules, and an Intel runner could not build the closure without a remote
  # builder. macos-latest has been arm64 since macos-14.
  build:
    name: Build the darwin configuration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Evaluate the flake
        run: nix flake check

      # `nix flake check` only evaluates, so it would still pass with a
      # derivation that cannot be built. Building the real system closure is
      # the gate that catches a renamed nix-darwin or Home Manager option, a
      # package dropped from nixpkgs, or a broken activation script - the whole
      # class of breakage that otherwise surfaces on the first ./rebuild.sh.
      # It never activates anything; `build` is not `switch`.
      - name: Build the system closure
        run: nix build --print-build-logs .#darwinConfigurations.mac.system

  # Everything the suite needs is installed here on purpose. A bare macOS
  # runner has no Pi package and no tmux, so a naive run would skip most of its
  # checks and still report success - which is exactly the failure this
  # workflow exists to prevent. --strict turns any remaining skip into a
  # failure, so CI cannot go green on checks that never ran.
  test:
    name: Test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Matches the nodejs_26 that home.nix installs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # tests/repo-hygiene.test.sh reads herdr's config.toml with a real TOML
      # parser, which means python3 >= 3.11 for tomllib. The runner image's own
      # python3 is not guaranteed to be that new, so the version is pinned here
      # rather than left to chance - otherwise that check would skip and
      # --strict would fail.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # tests/nixpkgs-channel.test.sh evaluates the flake to decide which store
      # paths the binary cache has to be able to serve, so the suite needs nix
      # too - without it that check would skip, and --strict would fail.
      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install tmux
        run: brew install tmux

      # tests/nvim.test.sh uses Neovim as the interpreter for the plugin specs
      # in home/.config/nvim/lua/plugins, because Neovim is what actually loads
      # them. The runner image does not ship it, and --strict turns the skip
      # that would cause into a failure. It has to be the Neovim this repo's own
      # flake pins rather than Homebrew's, for the same reason shellcheck and the
      # Pi target below are pinned, and for one more: the AGENTS.md decision
      # record rests on the markdown and markdown_inline parsers this nvim
      # bundles, so proving the specs load under some other Neovim would let the
      # suite stay green while that claim quietly stopped being true.
      # `--inputs-from .` reads the revision out of flake.lock, so the nvim under
      # test cannot drift from the one home.packages installs.
      - name: Install the flake-pinned Neovim
        run: |
          neovim=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#neovim')
          echo "$neovim/bin" >>"$GITHUB_PATH"

      # Pinned to the version tests/pi-calm.test.sh names as its TUI proof
      # target, so an upstream Pi release cannot turn CI red on its own.
      # --ignore-scripts matches the install command documented in README.md.
      - name: Install the Pi proof target and TypeScript
        run: |
          npm install --prefix "$RUNNER_TEMP/npm" --global --no-fund --no-audit \
            --ignore-scripts @earendil-works/pi-coding-agent@0.82.0 typescript
          echo "$RUNNER_TEMP/npm/bin" >>"$GITHUB_PATH"
          echo "PI_CALM_TEST_PACKAGE_DIR=$RUNNER_TEMP/npm/lib/node_modules/@earendil-works/pi-coding-agent" \
            >>"$GITHUB_ENV"

      - name: Run the test suite
        run: ./tests/run.sh --strict

  # AGENTS.md pins these scripts to bash 3.2 and BSD sed, and the test suite
  # only exercises the paths it happens to reach. shellcheck catches the rest -
  # unquoted expansions, dead assignments, misused test operators - so the
  # repo's shell rules are enforced rather than remembered. It needs no Nix and
  # no Pi, so it runs on a cheap Linux runner and reports long before the two
  # macOS jobs finish. It does not model bash 3.2, so a clean run here is not
  # proof of 3.2 compatibility; that stays a review concern.
  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than using whatever shellcheck the runner image ships, so
      # a new upstream release that adds a check cannot turn CI red on its own.
      # The checksum is verified because this job downloads an executable.
      - name: Install shellcheck
        run: |
          version=0.11.0
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v$version/shellcheck-v$version.linux.x86_64.tar.xz" \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "$sha256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" \
            --strip-components=1 "shellcheck-v$version/shellcheck"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Run shellcheck
        run: shellcheck bootstrap.sh rebuild.sh lib/*.sh tests/*.sh
